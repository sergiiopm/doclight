[package]
name = "doclight"
version = "0.2.3"
description = "A lightweight, minimal local document editor"
authors = ["sergiiopm"]
license = "MIT"
repository = "https://github.com/sergiiopm/doclight"
edition = "2021"

[lib]
name = "doclight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
